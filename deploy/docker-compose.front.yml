# EC2 Front-Office: nginx (tienda React + proxy) -> django (gunicorn :8000) -> RDS.
#
# Desde la raiz del repositorio, con el .env de produccion creado:
#   docker compose -f deploy/docker-compose.front.yml up -d --build
#   docker compose -f deploy/docker-compose.front.yml exec backend python manage.py seed_demo   (solo la primera vez)
#   docker compose -f deploy/docker-compose.front.yml logs -f
#
# El backend aplica las migraciones y recolecta los estaticos cada vez que arranca. Si RDS todavia no
# responde (por ejemplo, al reiniciar el lab), el contenedor falla y Docker lo reintenta solo.

name: cofrial-front

services:
  backend:
    build: ../backend
    restart: unless-stopped
    env_file: ../.env
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn cofrial.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile -"
    volumes:
      - estaticos:/app/staticfiles
    expose:
      - "8000"
    logging: &logs
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  nginx:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONT_PORT:-80}:80"
    volumes:
      - estaticos:/static:ro
    depends_on:
      - backend
    logging: *logs

volumes:
  estaticos:
