# nginx del Front-Office: sirve la tienda (React) y hace de proxy inverso hacia Django (gunicorn :8000).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 2m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # API y admin de Django
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Archivos estaticos del admin (volumen compartido con el backend: collectstatic)
    location /static/ {
        alias /static/;
        expires 7d;
    }

    # Archivos del build de Vite: llevan hash en el nombre, se pueden cachear largo
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React Router: cualquier otra ruta devuelve index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
